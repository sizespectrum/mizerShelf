url: https://sizespectrum.org/mizerShelf
template:
  bootstrap: 5
  bootswatch: cerulean

navbar:
  structure:
    left: [home, reference, articles]
    right: [mizer, github]
  components:
    home: ~
    mizer:
      text: mizer Home
      href: https://sizespectrum.org/mizer
    
home:
  sidebar:
    structure: [links, citation, license, dev]

destination: docs

reference:
- title: Detritus
- contents:
  - matches("etritus")
- title: Carrion
- contents:
  - matches("arrion")
  - rhoControl
  - setRho
- title: Plots
- contents:
  - matches("plot")
- title: Mortality
- contents:
  - matches("Mort")
  - shelf_mortality_breakdown
- title: Others
- contents:
  - mizerShelf-class
  - encounter_contribution
  - constant_dynamics
  - rescaleComponents
  - shelf_capabilities
- title: Example model
- contents:
  - matches("NWMed")
